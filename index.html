<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MeuEstudo</title>
  <meta name="description" content="MeuEstudo: organize horários, agenda, notas e sessões de foco, direto no seu aparelho, sem cadastro.">
  <meta name="theme-color" content="#0f766e">
  <meta name="color-scheme" content="light">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MeuEstudo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <!-- CSS dos módulos: carregado pelo shell; cada dono mantém apenas o seu arquivo. -->
  <link rel="stylesheet" href="css/modules/horarios-agenda.css">
  <link rel="stylesheet" href="css/modules/notas.css">
  <link rel="stylesheet" href="css/modules/foco.css">
</head>
<body>
  <a class="skip-link" href="#app">Ir para o conteúdo</a>

  <header class="app-header">
    <div class="app-header__inner">
      <span class="app-header__brand">
        <img src="assets/icons/icon-192.png" alt="" width="28" height="28" class="app-header__logo">
        <span class="app-header__name">MeuEstudo</span>
      </span>
      <button type="button" class="btn btn--small btn--secondary" id="btn-install" hidden>Instalar app</button>
    </div>
  </header>

  <main id="app" class="app-main" tabindex="-1" aria-live="polite">
    <p class="loading">Carregando…</p>
    <noscript><p class="notice">O MeuEstudo precisa de JavaScript ativado para funcionar.</p></noscript>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <ul class="bottom-nav__list">
      <li><a class="bottom-nav__link" href="#/inicio" data-route="inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Início</span></a></li>
      <li><a class="bottom-nav__link" href="#/horarios" data-route="horarios">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Horários</span></a></li>
      <li><a class="bottom-nav__link" href="#/agenda" data-route="agenda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Agenda</span></a></li>
      <li><a class="bottom-nav__link" href="#/notas" data-route="notas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3 3V20.5H6z"/><path d="M9 11h6M9 14.5h6M9 18h3"/></svg>
        <span>Notas</span></a></li>
      <li><a class="bottom-nav__link" href="#/foco" data-route="foco">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9.5 3h5"/></svg>
        <span>Foco</span></a></li>
    </ul>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
